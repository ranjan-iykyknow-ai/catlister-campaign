[project]
name = "campaign-dispatch-interview-backend"
version = "0.1.0"
description = "FastAPI backend for the campaign dispatch technical interview"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1",
    "pydantic>=2.10.0,<3",
    "uvicorn>=0.34.0,<1",
    "sqlalchemy>=2.0.36,<3",
    "email-validator>=2.2,<3",
    "httpx>=0.28.0,<1",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.25.0,<2",
    "ruff>=0.11.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501", "I"]
